[project]
name = "land-registry"
description = "Blockchain-based land registry system with multi-signature transfers"
authors = ["donebynino@gmail.com"]
telemetry = false
cache_dir = "./.clarinet"

[contracts.land-registry]
path = "contracts/land-registry.clar"
clarity_version = 2
epoch = 2.4

[repl]
costs_version = 2
parser_version = 2

[repl.analysis]
passes = ["check_checker"]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false
